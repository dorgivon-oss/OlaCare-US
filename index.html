<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OlaCare — Investor One-Pager</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:#F4F1EC;color:#0C0F14;-webkit-font-smoothing:antialiased;}
        .page{display:none;}.page.active{display:block;}

        /* ═══ MAIN ═══ */
        .garden-wrap{width:100%;max-width:960px;margin:0 auto;padding:24px 40px 32px;padding-left:0;}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
        .logo-img{height:55px;}
        .top-label{font-family:'DM Mono',monospace;font-size:9px;color:#8A857C;letter-spacing:2px;text-transform:uppercase;}
        .garden-svg{width:100%;height:auto;display:block;}
        .garden-svg text{font-family:'Instrument Serif',serif;}
        .garden-svg .mono{font-family:'DM Mono',monospace;}
        .garden-svg .sans{font-family:'DM Sans',sans-serif;}
        .stone-group{cursor:pointer;transition:all .25s ease;}
        .stone-group:hover{transform:translateY(-2px);filter:brightness(1.03);}

        /* ═══ DETAIL VIEWER ═══ */
        .detail-wrap{width:100%;max-width:960px;margin:0 auto;padding:16px 40px 32px;}
        .detail-back{
            display:inline-flex;align-items:center;gap:6px;
            font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
            color:#1A6B5A;cursor:pointer;margin-bottom:12px;
        }
        .detail-back:hover{opacity:.6;}
        .detail-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;}
        .detail-slides img{
            width:100%;height:auto;display:block;
            border-radius:6px;
            box-shadow:0 2px 12px rgba(0,0,0,0.08);
            margin-bottom:12px;
        }
    </style>
</head>
<body>
